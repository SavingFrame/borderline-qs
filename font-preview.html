<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borderline · Bar font preview</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--foreground, CanvasText); font: 15px/1.5 var(--font-sans, system-ui), sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.75rem; margin: 0; letter-spacing: -.035em; }
  p { margin: .25rem 0 1rem; }
  .muted, small { color: var(--muted-foreground, GrayText); }
  .controls { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; margin-bottom: 1rem; }
  button, select { font: inherit; color: inherit; background: var(--card, Canvas); border: 1px solid var(--border, GrayText); border-radius: 6px; padding: .15rem .45rem; }
  button, select, label:has(input) { cursor: pointer; }
  input { accent-color: var(--chart-1, #4081ce); }
  fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
  legend { padding: 0; font-weight: 650; }
  .sample { padding: .5rem 0 .7rem; border-bottom: 1px solid var(--border, color-mix(in srgb, CanvasText 18%, transparent)); }
  .sample-title { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: .75rem; margin-bottom: .35rem; }
  .sample-title input { margin-inline: 0 .4rem; }
  .bar { container-type: inline-size; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; padding: 0 10px; border: 1px solid #ffffff1f; border-radius: 12px; background: #111827; color: #f9fafb; font-size: 18px; font-weight: var(--preview-weight, 400); line-height: 1; white-space: nowrap; }
  .bar.tabular { font-variant-numeric: tabular-nums; }
  .workspaces, .status, .volume { display: flex; align-items: center; }
  .workspaces, .status { gap: 5px; }
  .workspace { display: grid; place-items: center; width: 28px; height: 30px; border: 1px solid transparent; border-radius: 10px; }
  .workspace.active { border-color: #93c5fd59; }
  .clock { justify-self: center; }
  .status { justify-self: end; }
  .volume { gap: 2px; }
  .icon { display: block; width: 20px; height: 20px; flex: none; }
  .result { margin-top: 1rem; display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .7rem; }
  code { font-family: var(--font-mono, monospace); }
  .footnote { margin: .4rem 0 0; font-size: .85rem; }
  .sprite { position: absolute; }
  @container (max-width: 490px) { .tray { display: none; } .workspace:last-child { display: none; } }
  @container (max-width: 365px) { .workspaces, .status { gap: 2px; } .workspace { width: 21px; } .workspace:nth-child(4), .bluetooth { display: none; } }
  @media (max-width: 375px) { .bar { grid-template-columns: auto 1fr auto; padding-inline: 6px; } }
</style>
</head>
<body>
<svg class="sprite" width="0" height="0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="tray" viewBox="0 0 24 24"><path fill="none" stroke="#93c5fd" stroke-width="2" d="m12 3 9 9-9 9-9-9z"/><circle fill="#93c5fd" cx="12" cy="12" r="2"/></symbol>
  <symbol id="wifi" viewBox="0 0 24 24"><path fill="currentColor" d="M2 8.5a16 16 0 0 1 20 0L12 21z"/></symbol>
  <symbol id="bluetooth" viewBox="0 0 24 24"><path d="m6 7 12 10-6 5V2l6 5L6 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="speaker" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15 9a4 4 0 0 1 0 6m2-9a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
</svg>
<main>
  <h1>Bar font preview</h1>
  <p class="muted">Same Borderline layout and colors, five locally installed fonts. Compare the clock, workspace numbers, and volume at the bar’s 18 px text size.</p>
  <div class="controls">
    <label>Weight <select id="weight"><option value="400">Regular</option><option value="700">Bold</option></select></label>
    <label>Sample <select id="mode"><option value="fixed">Static</option><option value="alternate">Alternate</option><option value="live">Live clock</option></select></label>
    <label><input id="tabular" type="checkbox"> Tabular digits</label>
  </div>
  <fieldset>
    <legend>Choose a font</legend>
    <div id="samples"></div>
  </fieldset>
  <div class="result"><span>QML:</span> <code id="qml" aria-live="polite"></code><button type="button" id="copy">Copy</button></div>
  <p class="muted footnote">The preview uses local fonts. The bar’s icon font stays unchanged; tray and status icons here are mockups.</p>
</main>
<script>
  const fonts = [
    ['Noto Sans', 'System sans match', 'sans-serif'],
    ['Adwaita Sans', 'Desktop UI sans', 'sans-serif'],
    ['Liberation Sans', 'Compact sans', 'sans-serif'],
    ['JetBrains Mono', 'Developer monospace', 'monospace'],
    ['Adwaita Mono', 'Desktop UI monospace', 'monospace']
  ];
  const icon = name => `<svg class="icon ${name}" aria-hidden="true"><use href="#${name}"/></svg>`;
  const $ = id => document.getElementById(id);
  for (const [index, [family, note, fallback]] of fonts.entries()) {
    $('samples').insertAdjacentHTML('beforeend', `
      <div class="sample">
        <div class="sample-title"><label><input type="radio" name="font" value="${index}" ${index === 0 ? 'checked' : ''}>${family}</label><small>${note}</small></div>
        <div class="bar" role="group" aria-label="${family} bar preview" style='font-family: "${family}", ${fallback}'>
          <div class="workspaces" aria-label="Workspaces">${[1, 2, 3, 4, 10].map(n => `<span class="workspace${n === 2 ? ' active' : ''}">${n}</span>`).join('')}</div>
          <span class="clock"></span>
          <div class="status">${icon('tray')}${icon('wifi')}${icon('bluetooth')}<span class="volume">${icon('speaker')}<span class="percent"></span></span><span class="clock"></span></div>
        </div>
      </div>`);
  }
  const formatter = new Intl.DateTimeFormat('en-GB', {hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'});
  const clocks = document.querySelectorAll('.clock');
  const percents = document.querySelectorAll('.percent');
  function updateSample() {
    const mode = $('mode').value;
    const time = mode === 'live' ? formatter.format(new Date()) : mode === 'alternate' ? '08:56:30' : '17:24:09';
    const percent = mode === 'alternate' ? '100%' : '67%';
    for (const el of clocks) if (el.textContent !== time) el.textContent = time;
    for (const el of percents) if (el.textContent !== percent) el.textContent = percent;
  }
  function updateStyle() {
    const family = fonts[document.querySelector('input[name="font"]:checked').value][0];
    document.documentElement.style.setProperty('--preview-weight', $('weight').value);
    for (const bar of document.querySelectorAll('.bar')) bar.classList.toggle('tabular', $('tabular').checked);
    $('qml').textContent = `font.family: "${family}"`;
    $('copy').textContent = 'Copy';
  }
  $('mode').addEventListener('change', updateSample);
  $('weight').addEventListener('change', updateStyle);
  $('tabular').addEventListener('change', updateStyle);
  $('samples').addEventListener('change', updateStyle);
  $('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText($('qml').textContent);
      $('copy').textContent = 'Copied';
    } catch {
      const range = document.createRange();
      range.selectNodeContents($('qml'));
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      $('copy').textContent = 'Selected';
    }
  });
  updateStyle();
  updateSample();
  setInterval(() => { if ($('mode').value === 'live') updateSample(); }, 250);
</script>
</body>
</html>
